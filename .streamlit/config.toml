[server]
address = "0.0.0.0"
port = 8501
headless = true
enableStaticServing = true
maxUploadSize = 50
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#0066CC"
backgroundColor = "#F5F5F7"
secondaryBackgroundColor = "#EEEEF0"
textColor = "#1D1D1F"
font = '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Inter, sans-serif'

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/InterVariable.woff2"
weight = "100 900"
style = "normal"
